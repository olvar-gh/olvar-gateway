[project]
name = "olvar-gateway"
version = "0.1.0"
description = "Raspberry Pi gateway: ESP32 telemetry over MQTT -> durable SQLite outbox -> Supabase"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9,<3",
    "httpx>=0.27,<1",
    "paho-mqtt>=2.1,<3",
]

[project.scripts]
olvar-gateway = "olvar_gateway.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olvar_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not e2e and not supabase'"
markers = [
    "e2e: end-to-end tests that need the local broker and Supabase stack",
    "supabase: tests that need the local Supabase stack",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
