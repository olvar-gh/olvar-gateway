name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI never deploys: production deploys are the manual `--remote` steps in docs/PLAN.md §7.
jobs:
  gateway:
    name: Gateway (ruff + pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  database:
    name: Database (pgTAP + generated types)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Exact version: `gen types` output can change between CLI releases, and the committed file must match it.
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.1.0
      - run: supabase start -x studio,imgproxy,vector,logflare,mailpit,edge-runtime
      - run: supabase db reset --local
      - run: supabase test db --local
      - name: Committed types match the migrations
        run: |
          supabase gen types --lang typescript --local > "$RUNNER_TEMP/database.types.ts"
          if ! diff -u supabase/types/database.types.ts "$RUNNER_TEMP/database.types.ts"; then
            echo "::error file=supabase/types/database.types.ts::Out of date. Regenerate with: supabase gen types --lang typescript --local > supabase/types/database.types.ts"
            exit 1
          fi

  chat-function:
    name: Chat function (deno test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: deno test --allow-net=127.0.0.1 supabase/functions/chat
